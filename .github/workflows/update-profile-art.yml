name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py nilesh24rit

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Move generated files
        run: |
          mkdir -p /tmp/heatmap
          mv contributions.json /tmp/heatmap/
          mv contrib-heatmap.svg /tmp/heatmap/

      - name: Checkout data branch
        run: |
          git fetch origin data
          git checkout -B data origin/data

      - name: Copy generated files
        run: |
          cp /tmp/heatmap/contributions.json .
          cp /tmp/heatmap/contrib-heatmap.svg .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contributions.json contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh contribution heatmap [skip ci]"
            git push origin data
          fi
