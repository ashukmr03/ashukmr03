name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py nilesh24rit

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit generated files to data branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: data
          commit_message: "chore: refresh contribution heatmap [skip ci]"
          file_pattern: "contributions.json contrib-heatmap.svg"
